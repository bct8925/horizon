# The Android APK (docs/android.md), with the Minimap native mod built in, for bct8925's fork:
# every push to its Android branches, or by hand (Actions > Android APK > Run workflow, or
# `gh workflow run android-apk.yml --ref <branch>` once the file is on the default branch).
# The APK is the run's artifact. It is signed with the key in the ANDROID_DEBUG_KEYSTORE secret
# (a debug keystore, base64), so it installs over a build made on the PC with the same key.
name: Android APK

on:
  push:
    branches: [android, android-ayaneo-pocket]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Only in the fork: upstream builds no APK.
    if: github.repository == 'bct8925/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NDK_VERSION: 28.2.13676358
      CARGO_INCREMENTAL: 0
    steps:
      - name: Make room
        # A release build for arm64 and the mods' copy of the source need more disk than the
        # runner leaves free.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Rust for Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .local/android -> target
          cache-on-failure: true

      - name: Minimap mod
        run: git clone --depth 1 https://github.com/horizon-rust/horizon-mods .local/android/horizon-mods

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_DEBUG_KEYSTORE secret: the APK gets a new key and won't install over the PC's builds."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Build
        working-directory: packaging/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon "-PnativeMods=.local/android/horizon-mods/native/minimap"

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-${{ github.ref_name }}-${{ github.sha }}
          path: packaging/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
