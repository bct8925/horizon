[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
png = "0.18"

[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

# arboard has no Android backend (clipboard.rs keeps an in-game clipboard there).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

# Android: winit's GameActivity backend (horizon-android hands it the activity).
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-game-activity"] }

[features]
controllers = []

[lints]
workspace = true
